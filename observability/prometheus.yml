global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: config
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['config:8888']}]
  - job_name: registry
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['registry:8761']}]
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['gateway:4000']}]
  - job_name: auth-service
    metrics_path: /uaa/actuator/prometheus
    static_configs: [{targets: ['auth-service:5000']}]
  - job_name: account-service
    metrics_path: /accounts/actuator/prometheus
    static_configs: [{targets: ['account-service:6000']}]
  - job_name: statistics-service
    metrics_path: /statistics/actuator/prometheus
    static_configs: [{targets: ['statistics-service:7000']}]
  - job_name: notification-service
    metrics_path: /notifications/actuator/prometheus
    static_configs: [{targets: ['notification-service:8000']}]
  - job_name: monitoring
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['monitoring:8080']}]
  - job_name: turbine-stream-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['turbine-stream-service:8989']}]
